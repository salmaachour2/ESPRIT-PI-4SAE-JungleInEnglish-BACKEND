# ── Base de données H2 en mémoire pour les tests ──────────────────────────
spring.datasource.url=jdbc:h2:mem:testpayments;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Désactiver Eureka pour les tests ───────────────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ── Stripe (clé factice pour les tests) ───────────────────────────────────
stripe.secret-key=sk_test_fake_key_for_tests
stripe.publishable-key=pk_test_fake_key_for_tests

# ── Feign : URL directes pour bypasser le LoadBalancer dans les tests ─────
spring.cloud.openfeign.client.config.jungle-events.url=http://localhost:8095
spring.cloud.openfeign.client.config.USER-SERVICE.url=http://localhost:8089
