apiVersion: apps/v1
kind: Deployment
metadata:
  name: jungle-events
  labels:
    app: jungle-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jungle-events
  template:
    metadata:
      labels:
        app: jungle-events
    spec:
      containers:
        - name: jungle-events
          image: salmaachour2/jungle-events:latest
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: jungle-events-secret
                  key: db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jungle-events-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jungle-events-secret
                  key: db-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jungle-events
spec:
  selector:
    app: jungle-events
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  type: ClusterIP
