# ── Base de données H2 en mémoire pour les tests ──────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Désactiver Eureka pour les tests ───────────────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ── Mail : paramètres factices pour les tests (pas de connexion SMTP réelle) ──
# NE PAS exclure MailSenderAutoConfiguration — EmailServiceImpl en dépend.
# Spring ne teste pas la connexion au démarrage, seulement lors d'un vrai envoi.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Propriétés RIB injectées dans EmailServiceImpl via @Value ─────────────
app.rib.bank=Banque Test
app.rib.iban=TN00 0000 0000 0000 0000 0000
app.rib.bic=TESTTNTX
app.rib.account.name=Jungle Events Test

# ── Feign : URL directes pour bypasser le LoadBalancer dans les tests ─────
# Un Feign client avec une URL configurée n'utilise jamais le load balancer.
spring.cloud.openfeign.client.config.jungle-payments.url=http://localhost:8091
spring.cloud.openfeign.client.config.USER-SERVICE.url=http://localhost:8089

# ── Upload fichiers ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
